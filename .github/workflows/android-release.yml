name: Android Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Build direct release APK
        run: flutter build apk --release --flavor direct

      - name: Build Play release AAB
        run: flutter build appbundle --release --flavor play --dart-define=GOZDAR_PLAY_DISTRIBUTION=true

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-direct-release.apk build/app/outputs/flutter-apk/gozdar-${RELEASE_TAG}-android.apk
          cp build/app/outputs/bundle/playRelease/app-play-release.aab build/app/outputs/bundle/playRelease/gozdar-${RELEASE_TAG}-play.aab

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/gozdar-${{ github.event.release.tag_name }}-android.apk
            build/app/outputs/bundle/playRelease/gozdar-${{ github.event.release.tag_name }}-play.aab

      - name: Upload Play release to internal testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          SKIP_ANDROID_BUILD: "1"
        run: cd android && bundle exec fastlane android internal

      - name: Upload Play release to production
        if: ${{ !github.event.release.prerelease }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          SKIP_ANDROID_BUILD: "1"
        run: cd android && bundle exec fastlane android production
