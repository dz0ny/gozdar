name = "gozdar-proxy"
main = "src/index.js"
compatibility_date = "2025-11-17"

# Sečnja share links are served from this host.
routes = [{ pattern = "gozdar.dz0ny.dev", custom_domain = true }]

[placement]
mode = "smart"

[[r2_buckets]]
binding = "TILES_BUCKET"
bucket_name = "gozdar-v2"

[ai]
binding = "AI"

# Read new e-uprava sale offers once a day, at 03:17 UTC.
[triggers]
crons = ["17 3 * * *"]

# Decoding scanned PDFs needs more CPU time than tile proxying.
[limits]
cpu_ms = 120000

# Sečnja shares. Each value expires 30 days after the last upload.
[[kv_namespaces]]
binding = "SHARES"
id = "0a01653de1cc4fc7954663e41a211222"
